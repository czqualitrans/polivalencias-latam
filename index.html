*,*:before,*:after{box-sizing:border-box}
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
html.big{font-size:125%}body{margin:0;background:var(--bg);color:var(--fg);font:1.125rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}

button,.btn{font:inherit;cursor:pointer;border-radius:12px;border:2px solid var(--ac);background:var(--ac);color:var(--bg);padding:10px 18px;min-height:44px}

button.sm{padding:4px 10px;min-height:36px;font-size:.9rem}
button[aria-pressed=true]{background:var(--wine);border-color:var(--wine);color:#fff}
button:disabled{opacity:.55;cursor:not-allowed}
:focus-visible{outline:3px solid var(--lil);outline-offset:2px}
main{max-width:1050px;margin:0 auto;padding:0 20px}
.hero{padding:56px 0 36px;text-align:center}
.hero h1{font-size:clamp(2.2rem,6vw,3.6rem);margin:0}
.tag{font-family:Georgia,serif;font-style:italic;color:var(--wine);font-size:1.4rem;margin:.3em 0}

.cta{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
section{padding:28px 0}
h2{font-size:1.9rem;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:1.3rem}
.badge{align-self:flex-start;background:var(--bdg);color:var(--bdt);border-radius:99px;padding:2px 12px;font-size:.85rem}
.badge.pre{background:var(--wine);color:var(--bdt)}
.price{font-weight:700;color:var(--wine)}
.mut{color:var(--mut);font-size:.95rem}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.note{border-left:4px solid var(--lil);background:var(--card);padding:12px 16px;border-radius:0 12px 12px 0;margin:12px 0}
dialog{max-width:min(620px,94vw);border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);padding:22px}
dialog::backdrop{background:rgba(10,15,30,.5)}
.frag{font-family:Georgia,serif;font-style:italic;white-space:pre-line}
.tc-item{display:block;margin:8px 0;font-size:.98rem}
.tc-item input{width:20px;height:20px;vertical-align:-4px;margin-right:6px}
footer{border-top:1px solid var(--line);margin-top:30px;padding:24px 20px 90px;text-align:center;color:var(--mut);font-size:.9rem}
#ast{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:6}
#panel{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(380px,calc(100vw - 32px));height:min(520px,70vh);background:var(--card);border:1px solid var(--line);border-radius:18px;display:none;flex-direction:column;z-index:6;overflow:hidden}
#panel.open{display:flex}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.m{padding:8px 12px;border-radius:14px;max-width:88%;font-size:.95rem;white-space:pre-wrap}
.m.a{background:var(--bg);align-self:flex-start}
.m.u{background:var(--ac);color:var(--bg);align-self:flex-end}
#f{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#f input{flex:1;font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
